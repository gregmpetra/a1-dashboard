name: A1 Dashboard Daily Sync

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run sync
        env:
          A1_SPAPI_CLIENT_ID: ${{ secrets.A1_SPAPI_CLIENT_ID }}
          A1_SPAPI_CLIENT_SECRET: ${{ secrets.A1_SPAPI_CLIENT_SECRET }}
          A1_SPAPI_REFRESH_TOKEN: ${{ secrets.A1_SPAPI_REFRESH_TOKEN }}
          MARKETPLACE_ID: ATVPDKIKX0DER
        run: python3 sync.py

      - name: Commit and push data.json
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.email "sync@a1dashboard.com"
          git config user.name "A1 Dashboard Sync"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/gregmpetra/a1-dashboard.git
          git add data.json
          git diff --staged --quiet || git commit -m "Auto sync $(date +%Y-%m-%d)"
          git push --force origin master
